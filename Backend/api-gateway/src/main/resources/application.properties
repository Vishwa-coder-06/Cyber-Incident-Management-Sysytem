spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Deduplicate CORS headers to prevent duplicate Access-Control-Allow-Origin / Credentials
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

# ==============================
# USER SERVICE
# ==============================

spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.routes[1].id=auth-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[2].id=settings-service
spring.cloud.gateway.routes[2].uri=lb://user-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/settings/**


# ==============================
# INCIDENT SERVICE
# ==============================

spring.cloud.gateway.routes[3].id=incident-service
spring.cloud.gateway.routes[3].uri=lb://incident-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/incidents/**


