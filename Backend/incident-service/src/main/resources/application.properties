spring.application.name=incident-service

server.port=8082

spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=secureops
spring.datasource.password=secureops
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# JWT
jwt.secret=SecureOpsSecretKeyForJwtAuthentication2026VerySecureKey123
jwt.expiration=86400000

# AI Service URL (ai-service port 8086)
ai.service.url=http://localhost:8086

# Knowledge Service URL (knowledge-service port 8085)
knowledge.service.url=http://localhost:8085

# Python ML Service URL (port 5000)
ml.service.url=http://127.0.0.1:5000

# Audit Service URL (audit-service port 8087)
audit.service.url=${AUDIT_SERVICE_URL:http://localhost:8087}